{% extends "base.html" %}
{% block title %}{{ title }} · RUMBU{% endblock %}
{% block content %}
<div class="panel" style="max-width:560px;margin:40px auto">
  <h1 style="font-size:28px">{{ title }}</h1>
  <p class="sub" style="font-size:16px">{{ message }}</p>
  <a class="btn" href="{{ url_for('app_home') if user else url_for('landing') }}">{{ 'Go to my dashboard' if user else 'Go to the home page' }}</a>
</div>
{% endblock %}
